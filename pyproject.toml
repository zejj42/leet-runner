[project]
name = "leet-runner"
version = "0.1.0"
description = "The LeetTracker list, to solve and test locally."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]                      # the kit's own tests; problems are judged by ▶ and `leet test`
addopts = "-q -p no:cacheprovider"
